name: Update Profile Stats

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ GitHub Stats Card (streak, most used languages, trophies)
      - name: Generate GitHub Stats Images
        run: |
          mkdir -p assets
          curl -o assets/streak.svg "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=radical"
          curl -o assets/langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=radical"
          curl -o assets/trophies.svg "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=radical"

      # ✅ GitHub Snake Game
      - name: Generate Snake Game
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update GitHub profile stats [skip ci]" || echo "No changes to commit"
          git push
