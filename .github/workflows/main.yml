name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # Check out your repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Generate GitHub Streak Stats
      - name: GitHub Streak Stats
        run: |
          curl -o streak-stats.svg "https://github-readme-streak-stats.herokuapp.com?user=Aisha-naz&theme=dark&hide_border=true"

      # Generate Most Used Languages Card
      - name: Most Used Languages
        run: |
          curl -o top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Aisha-naz&layout=compact&theme=dark&hide_border=true"

      # Generate Snake Animation
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Aisha-naz
          outputs: |
            dist/snake.svg

      # Commit and push changes
      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Updated README stats and snake game"
          git push
